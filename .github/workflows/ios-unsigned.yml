name: Evaluate fish identification models
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'open_clip_torch==2.32.0' 'numpy<2' Pillow
      - name: Evaluate Fishial on public reference photos
        run: python -u evaluation/benchmark.py fishial | tee "$RUNNER_TEMP/fishial-results.txt"
      - name: Evaluate BioCLIP 2 on the same photos
        run: python -u evaluation/benchmark.py bioclip | tee "$RUNNER_TEMP/bioclip-results.txt"
      - name: Upload results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fish-identification-evaluation
          path: |
            ${{ runner.temp }}/fishial-results.txt
            ${{ runner.temp }}/bioclip-results.txt
          if-no-files-found: warn
          retention-days: 7
