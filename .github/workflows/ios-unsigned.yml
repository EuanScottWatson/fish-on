name: Build Swift iPhone preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test data handling
        run: swift test --package-path ios-native
      - name: Install project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-native/project.yml
      - name: Build simulator app
        run: |
          xcodebuild -project ios-native/FishOnNativePreview.xcodeproj -scheme FishOnNativePreview \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/fish-simulator" CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project ios-native/FishOnNativePreview.xcodeproj -scheme FishOnNativePreview \
            -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/fish-swift" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/fish-swift/Build/Products/Release-iphoneos/FishOnNativePreview.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry Fish-On-Swift-preview-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: fish-on-swift-preview-unsigned-ios
          path: ${{ runner.temp }}/package/Fish-On-Swift-preview-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
