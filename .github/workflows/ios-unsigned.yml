name: Build unsigned iPhone app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check case-insensitive filenames
        run: node tests/check-case-collisions.cjs
      - name: Install dependencies
        run: npm ci
      - name: Generate iOS project
        run: ./node_modules/.bin/expo prebuild --platform ios --no-install
      - name: Install iOS dependencies
        run: pod install --project-directory=ios
      - name: Build unsigned app for iPhone
        run: |
          xcodebuild -workspace ios/FishOn.xcworkspace -scheme FishOn \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/fish-on-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/fish-on-build/Build/Products/Release-iphoneos/FishOn.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry Fish-On-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: fish-on-unsigned-ios
          path: ${{ runner.temp }}/package/Fish-On-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
