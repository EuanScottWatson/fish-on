name: FishOnSwift
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
targets:
  FishOnSwift:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/FishCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.fishbook.homelab
        PRODUCT_NAME: FishOnSwift
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        CURRENT_PROJECT_VERSION: '2'
        MARKETING_VERSION: '1.1.0'
        INFOPLIST_KEY_CFBundleDisplayName: Fish On
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Fish On connects to your home server to show your fishing journal.
    info:
      path: App/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleDisplayName: Fish On
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Fish On connects to your home server to show your fishing journal.
        NSCameraUsageDescription: Take photographs of your catches.
        NSLocationWhenInUseUsageDescription: Use your location to record where you fished.
        NSPhotoLibraryUsageDescription: Select photos of catches.
        NSPhotoLibraryAddUsageDescription: Save catch photographs to Photos.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
  FishOnNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FishOnSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.fishbook.homelab.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FishOnSwift
schemes:
  FishOnSwift:
    build:
      targets:
        FishOnSwift: all
    test:
      targets:
        - FishOnNativeUITests
