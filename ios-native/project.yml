name: FishOnNativePreview
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
targets:
  FishOnNativePreview:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/FishCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.fishbook.homelab.nativepreview
        PRODUCT_NAME: FishOnNativePreview
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        CURRENT_PROJECT_VERSION: '1'
        MARKETING_VERSION: '0.1.0'
        INFOPLIST_KEY_CFBundleDisplayName: Fish On Preview
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Fish On connects to your home server to show your fishing journal.
    info:
      path: App/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleDisplayName: Fish On Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Fish On connects to your home server to show your fishing journal.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
schemes:
  FishOnNativePreview:
    build:
      targets:
        FishOnNativePreview: all
